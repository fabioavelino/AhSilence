name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ["v*"]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Stage APK
        id: stage
        run: |
          VERSION_NAME=$(sed -n 's/^versionName = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/AhSilence-${VERSION_NAME}-debug.apk"
          echo "apk=dist/AhSilence-${VERSION_NAME}-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: AhSilence-debug-apk
          path: ${{ steps.stage.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.stage.outputs.apk }}
          generate_release_notes: true
